<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Engineering Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .chatbot {
            width: min(920px, 94vw);
            height: min(760px, 92vh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #e1e6ef;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(25, 40, 70, 0.10);
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #e8ecf2;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            color: #667085;
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 14px;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            margin-right: auto;
            background: #f0f3f8;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
            color: #ffffff;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e8ecf2;
        }

        textarea {
            flex: 1;
            min-height: 48px;
            max-height: 140px;
            resize: none;
            padding: 13px;
            border: 1px solid #d7dde7;
            border-radius: 12px;
            outline: none;
            font: inherit;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            padding: 0 22px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .chatbot {
                width: 100vw;
                height: 100vh;
                border: 0;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .composer {
                padding: 12px;
            }

            button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <main class="chatbot">
        <header class="header">
            <h1>Prompt Engineering Study Assistant</h1>
            <p>Ask questions about Prompt Engineering using the provided study material.</p>
        </header>

        <section class="messages" id="messages">
            <div class="message bot">
                Hello! I can help you study Prompt Engineering using the provided study material.
            </div>
        </section>

        <form class="composer" id="chatForm">
            <textarea
                id="message"
                placeholder="Ask a Prompt Engineering question..."
                aria-label="Prompt Engineering question"
                required
            ></textarea>

            <button type="submit" id="sendButton">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;
            message.textContent = text;

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = input.value.trim();

            if (!question) {
                return;
            }

            addMessage(question, "user");

            input.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                addMessage(data.answer, "bot");
            } catch (error) {
                addMessage(
                    error.message || "Something went wrong. Please try again.",
                    "bot"
                );
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
</body>
</html>
